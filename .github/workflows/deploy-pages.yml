name: Deploy to GitHub Pages

# NOTE: this workflow only runs when the repository's Pages *source* is set to
# "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source).
# With the default "Deploy from a branch" setting GitHub ignores this file and
# publishes the raw, unbuilt sources instead - which is why the game used to
# load as plain unstyled HTML.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check the build produced a playable bundle
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q 'assets/' dist/index.html || { echo "assets not referenced in dist/index.html"; exit 1; }
          ls dist/assets/*.js >/dev/null || { echo "no JS bundle emitted"; exit 1; }
          echo "Bundle ready:"
          ls -la dist dist/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
